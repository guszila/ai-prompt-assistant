[package]
name = "ai-engineering-assistant-desktop"
version = "0.1.0"
description = "AI Engineering Assistant Desktop App"
authors = ["AI Engineering Assistant Team"]
edition = "2021"

[lib]
name = "ai_engineering_assistant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
